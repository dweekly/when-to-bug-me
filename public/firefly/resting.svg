    </clipPath>
  </defs>
  <style>
    .bm-resting .abdomen-motion { transform-box:view-box; transform-origin:127.8px 136px; animation:bm-resting-breath 7.5s ease-in-out infinite; }
    .bm-resting .head-motion { transform-box:view-box; transform-origin:127.8px 136px; animation:bm-resting-nod 10.5s ease-in-out infinite; }
    .bm-resting .antenna-left-flex { transform-box:view-box; transform-origin:112.689px 74.514px; animation:bm-resting-left-feeler 10s ease-in-out -1.2s infinite; }
    .bm-resting .antenna-right-flex { transform-box:view-box; transform-origin:142.903px 74.514px; animation:bm-resting-right-feeler 11.3s ease-in-out -2.7s infinite; }
    .bm-resting .wing-left-flex { transform-box:view-box; transform-origin:108.612px 136.166px; animation:bm-resting-left-wing 7.5s ease-in-out infinite; }
    .bm-resting .wing-right-flex { transform-box:view-box; transform-origin:146.986px 136.166px; animation:bm-resting-right-wing 7.5s ease-in-out -.5s infinite; }
    .bm-resting .light-pulse, .bm-resting .halo-pulse { animation:bm-resting-light 8s ease-in-out infinite; }
    .bm-resting .eye-left, .bm-resting .eye-right { transform-box:fill-box; transform-origin:center; animation:bm-resting-blink 14s linear infinite; }
    @keyframes bm-resting-breath { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.012,1.025); } }
    @keyframes bm-resting-nod {
      0%,100% { transform:rotate(0deg); } 25% { transform:rotate(-0.358deg); }
      60% { transform:rotate(0.55deg); } 85% { transform:rotate(-0.138deg); }
    }
    @keyframes bm-resting-left-feeler {
      0%,22%,65%,100% { transform:rotate(0deg) skewX(0deg); }
      32% { transform:rotate(-1.8deg) skewX(-0.45deg); }
      43% { transform:rotate(0.99deg) skewX(0.252deg); }
      54% { transform:rotate(-0.36deg) skewX(-0.09deg); }
    }
    @keyframes bm-resting-right-feeler {
      0%,38%,85%,100% { transform:rotate(0deg) skewX(0deg); }
      50% { transform:rotate(1.44deg) skewX(0.36deg); }
      61% { transform:rotate(-0.9deg) skewX(-0.225deg); }
      73% { transform:rotate(0.36deg) skewX(0.09deg); }
    }
    @keyframes bm-resting-left-wing { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(0.7deg); } }
    @keyframes bm-resting-right-wing { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(-0.7deg); } }
    @keyframes bm-resting-light { 0%,100% { opacity:.92; } 50% { opacity:1; } }
    @keyframes bm-resting-blink { 0%,41.4%,43.4%,100% { transform:scaleY(1); } 42.4% { transform:scaleY(.08); } }
    .bm-resting.glow-only .firefly { display:none; }
    .bm-resting.glow-only .art-motion { animation:none !important; transform:none; }
    
@media (prefers-reduced-motion: reduce) {
.bm-resting .art-motion,
.bm-resting .abdomen-motion,
.bm-resting .head-motion,
.bm-resting .antenna-left-flex,
.bm-resting .antenna-right-flex,
.bm-resting .wing-left-flex,
.bm-resting .wing-right-flex,
.bm-resting .light-pulse,
.bm-resting .halo-pulse,
.bm-resting .eye-left,
.bm-resting .eye-right { animation:none !important; }
}
</style>
