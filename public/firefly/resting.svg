<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" class="bug-me bm-resting" role="img" aria-labelledby="resting-title resting-desc" data-state="resting">
  <title id="resting-title">Bug Me: resting</title>
  <desc id="resting-desc">Content and relaxed, with soft eyes, a tiny resting smile, and a slow, faint yellow light.</desc>
  <defs>
    <radialGradient id="resting-tail-light-gradient" gradientUnits="userSpaceOnUse" cx="127.796" cy="191.081" r="31.03">
      <stop offset="0" stop-color="#FFFBD0" />
      <stop offset="0.32" stop-color="#FFF8B0" />
      <stop offset="0.72" stop-color="#FFF06B" />
      <stop offset="1" stop-color="#FFE34A" />
    </radialGradient>
    <radialGradient id="resting-tail-halo-gradient" gradientUnits="userSpaceOnUse" cx="127.796" cy="191.081" r="37.563">
      <stop offset="0" stop-color="#FFE34A" stop-opacity="0.55" />
      <stop offset="0.78" stop-color="#FFE34A" stop-opacity="0.55" />
      <stop offset="0.86" stop-color="#FFE34A" stop-opacity="0.38" />
      <stop offset="0.93" stop-color="#FFE34A" stop-opacity="0.14" />
      <stop offset="1" stop-color="#FFE34A" stop-opacity="0" />
    </radialGradient>
    <clipPath id="resting-head-clip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="256" height="138" />
    </clipPath>
