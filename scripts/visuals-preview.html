<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Briefing visuals preview</title>
    <!-- Dev only: built by `npm run preview:visuals` (scripts/build-visuals-preview.mjs). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="../public/visuals.css" />
    <style>
      body { margin: 0; padding: 24px; background: #0f1226; color: #ecebf5; font: 14px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif; }
      #root { display: flex; gap: 40px; align-items: flex-start; }
      .col { flex: none; }
      .col h1 { font-size: 13px; color: #6b6e8c; font-weight: 400; margin: 0 0 12px; }
      .card { background: #171b33; border: 1px solid #2a2f4d; border-radius: 14px; padding: 20px 16px; margin-bottom: 16px; }
      .card h2 { font-size: 11px; font-weight: 400; color: #6b6e8c; margin: 0 0 14px; font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="../dist/visuals-preview.js"></script>
  </body>
</html>
